name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué ha pasado
      description: Qué esperabas y qué ocurrió en su lugar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Añade dos imágenes PNG
        2. Elige el modo horizontal 4x2
        3. Genera el PDF
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema
      placeholder: Firefox 131 en Windows 11
  - type: textarea
    id: config
    attributes:
      label: Configuración o proyecto
      description: Si puedes, adjunta el proyecto .zip o describe la configuración usada.
